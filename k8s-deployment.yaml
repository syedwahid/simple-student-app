apiVersion: v1
kind: Namespace
metadata:
  name: simple-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app
  namespace: simple-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      containers:
      - name: student-app
        image: simple-student-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: student-app-service
  namespace: simple-app
spec:
  type: NodePort
  selector:
    app: student-app
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
